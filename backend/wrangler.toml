name = "watch-atlas-prices"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://www.arunabhosom.com,https://arunabhosom.com,https://aarunabhs.github.io,http://localhost:4173,http://127.0.0.1:4173"

[[ratelimits]]
name = "LOOKUP_LIMITER"
namespace_id = "31001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "SEARCH_BUDGET"
namespace_id = "31002"
simple = { limit = 30, period = 60 }

# Universal Watch Finder uses WATCHES_D1. Add a d1_databases binding with the
# actual database ID before activating it; see docs/universal-watch-finder.md.
