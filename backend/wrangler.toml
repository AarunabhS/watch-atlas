name = "watch-atlas-prices"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://www.arunabhosom.com,https://arunabhosom.com,https://aarunabhs.github.io,http://localhost:4173,http://127.0.0.1:4173"

[[ratelimits]]
name = "LOOKUP_LIMITER"
namespace_id = "31001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "SEARCH_BUDGET"
namespace_id = "31002"
simple = { limit = 30, period = 60 }

# Universal Watch Finder catalog.
[[d1_databases]]
binding = "WATCHES_D1"
database_name = "watch-atlas-catalog"
database_id = "df288d98-0322-4b66-985a-d4e564e17fba"
migrations_dir = "migrations"
